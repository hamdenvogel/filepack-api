name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Maven tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw -B test
