name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test (package)
        run: |
          chmod +x mvnw
          ./mvnw -B clean package

      - name: Show generated jar
        run: ls -lh target/*.jar

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: filepack-api-jar
          path: |
            target/filepack-api-*.jar
            !target/*-sources.jar
            !target/*-javadoc.jar
          retention-days: 7
          if-no-files-found: error

      - name: Build Docker image
        run: docker build -t filepack-api:ci .

      # Politica Fase 4 (FilePack):
      # - scan CRITICAL de libs e gera relatorio
      # - exit-code 0 por enquanto: ha CVEs CRITICAL herdados/triagem via Dependabot + artefato
      # - o relatorio continua obrigatorio (upload abaixo)
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: filepack-api:ci
          format: table
          exit-code: "0"
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: "library"

      - name: Export Trivy report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: filepack-api:ci
          format: json
          output: trivy-report.json
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: "os,library"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Start container
        run: docker run --detach --name filepack-api-ci --publish 8080:8080 filepack-api:ci

      - name: Check container health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:8080/actuator/health; then
              echo
              echo "FilePack API container is healthy."
              exit 0
            fi

            if ! docker container inspect filepack-api-ci --format '{{.State.Running}}' | grep -q true; then
              echo "Container stopped before becoming healthy."
              docker logs filepack-api-ci
              exit 1
            fi

            echo "Waiting for FilePack API (attempt ${attempt}/30)..."
            sleep 2
          done

          echo "Health check timed out."
          docker logs filepack-api-ci
          exit 1

      - name: Show container logs
        if: always()
        run: |
          if docker container inspect filepack-api-ci >/dev/null 2>&1; then
            docker logs filepack-api-ci
          else
            echo "Container was not started; skipping logs."
          fi

      - name: Stop container
        if: always()
        run: docker rm --force filepack-api-ci || true

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
