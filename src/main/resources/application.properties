spring.application.name=filepack-api

# Cloud Run (e outros PaaS) injetam PORT; localmente permanece 8080.
server.port=${PORT:8080}

# Limite padrão do Spring Boot é 1MB/arquivo e 10MB/request — insuficiente para packs reais.
# No Cloud Run o limite prático do request HTTP costuma ser ~32 MB.
spring.servlet.multipart.max-file-size=32MB
spring.servlet.multipart.max-request-size=32MB

filepack.about.autor=HV Softwares
filepack.about.aplicacao=FilePack API
filepack.about.descricao=API para empacotar e descompactar arquivos nos formatos ZIP e 7z (com ou sem senha)
filepack.about.versao=0.0.2-SNAPSHOT
